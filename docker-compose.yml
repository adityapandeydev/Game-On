services:
  # 1. PostgreSQL 16 Database with Persistent Storage
  db:
    image: postgres:16-alpine
    container_name: game_on_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-6243}
      POSTGRES_DB: game_on
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume guarantees data persists across restarts & laptop shutdowns
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_on"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Go + Chi High-Performance Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: game_on_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: "postgres://postgres:6243@db:5432/game_on?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-game_on_super_secret_jwt_key_2026}
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Host-managed persistent volume stored in Docker's internal data directory
  postgres_data:
    driver: local
